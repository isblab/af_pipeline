protein_uniprot_map:
  "Cdc3": "P39825"
  "Act1": "P10989"
  "Dp1": "P15924-1"

af_input_jobs:
  Lb2Cas12a_RNA_DNA_complex_8I54_targets: # job_cycle_id
  # job_sets_list
  - job_set_name: "Lb2Cas12a_RNA_DNA_complex" # user provided job name
    modelSeeds: [1, 2] # 2 models with seeds 1 and 2
    entities:
    - name: "Lb2Cas12a"
      type: "proteinChain"
      count: 1
      useStructureTemplate: true # by default set to true
      maxTemplateDate: "2023-01-01" # by default set to 2021-09-30
      glycans: [["BMA", 5]]
      modifications:
      - - "CCD_HY3"
        - 11
    - name: "RNA_33"
      type: "rnaSequence"
    - name: "DNA_25"
      type: "dnaSequence"
    - name: "DNA_mod"
      type: "dnaSequence"
      modifications: [["CCD_6OG", 2], ["CCD_6MA", 1]]
    - name: "MG"
      type: "ion"
      count: 1

  Actin_profilin_targets:
  # job 1
  # no user provided job name
  - modelSeeds: 2 # 2 models with randomly generated seeds
    entities:
    - name: "Act1"
      type: "proteinChain"
      range: [1, 375]
    - name: "Cdc3"
      range: [11, 120]
      type: "proteinChain"
    af_offset:
      B: [11, 120]
  # job 2
  # no user provided job name or model seeds
  - entities:
    - name: "Act1"
      type: "proteinChain"
    - name: "Cdc3"
      type: "proteinChain"
  # job 3
  - job_set_name: "actin_profilin_complex"
    entities:
    - name: "Act1"
      type: "proteinChain"
    - name: "Cdc3"
      type: "proteinChain"
    - name: "CCD_ATP"
      type: "ligand"
      count: 1
    - name: "MG"
      type: "ion"
      count: 1

  DP_dimer_targets:
  - modelSeeds: 1 # 1 model with randomly generated seed
    entities:
    - name: "Dp1"
      type: "proteinChain"
      count: 2
      range: [1021, 1950]
      useStructureTemplate: false

  Collagen_triple_helix_targets:
  - job_set_name: "collagen_triple_helix"
    entities:
    - name: "collagen_polypeptide"
      type: "proteinChain"
      count: 3
      maxTemplateDate: "2023-01-01"
      useStructureTemplate: true

af_master_dirs:
- ./input/AF_predictions/AF3

af_cycle_dirs:
- ./input/AF_predictions/AF3/Collagen_triple_helix_targets

af_job_set_dirs:
- ./input/AF_predictions/AF3/Actin_profilin_targets/Act1_1_1-375_Cdc3_1_1-127
- ./input/AF_predictions/AF3/Actin_profilin_targets/actin_profilin_complex

