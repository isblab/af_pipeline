protein_uniprot_map:
  "Cdc3": "P39825"
  "Act1": "P10989"
  "Dp1": "P15924-1"

af_input_jobs:
  # job set 1
  # no user provided job name
  - modelSeeds: 2 # 2 models with randomly generated seeds
    msa:
      type: "pairedMsa"
      path: "./input/msa/paired/out/pair.a3m" # if the path does not exist, the MSA will be generated using MMSeqs2 API
    entities:
    - name: "Act1"
      type: "proteinChain"
      range: [1, 375]
      templates:
      - path: "./input/templates/1J6Z.cif"
        chain: "A"
        resrange: "4-375"
      - path: "./input/templates/3UB5.cif"
        chain: "A"
    - name: "Cdc3"
      range: [11, 120]
      type: "proteinChain"
      templates:
      - path: "./input/templates/3UB5.cif"
        chain: "P"
        range: "11-120"

  # job set 2
  # no user provided job name or model seeds
  - msa:
      type: "unpairedMsa"
      path: "./input/msa/unpaired/out/uniref.a3m"
    entities:
    - name: "Act1"
      type: "proteinChain"
    - name: "Cdc3"
      type: "proteinChain"

  # job set 3
  - job_set_name: "actin_profilin_complex"
    entities:
    - name: "Act1"
      type: "proteinChain"
    - name: "Cdc3"
      type: "proteinChain"
    - name: "CCD_ATP"
      type: "ligand"
      count: 1
    - name: "MG"
      type: "ion"
      count: 1

  - modelSeeds: [1] # 1 model with seed 1
    entities:
    - name: "DNA25"
      type: "dnaSequence"
      strand: "double"

  - modelSeeds: [1] # 1 model with seed 1
    entities:
    - name: "RNA33"
      type: "rnaSequence"
      strand: "double"

  - job_set_name: "Single_stranded_DNA"
    modelSeeds: [1] # 1 model with seed 1
    entities:
    - name: "DNA20"
      type: "dnaSequence"

  - job_set_name: "Lb2Cas12a_RNA_DNA_complex" # user provided job name
    modelSeeds: [1, 2] # 2 models with seeds 1 and 2
    entities:
    - name: "Lb2Cas12a"
      type: "proteinChain"
      count: 1
      useStructureTemplate: true # by default set to true
      maxTemplateDate: "2023-01-01" # by default set to 2021-09-30
      glycans: [["BMA", 5]]
      modifications: [["CCD_HY3", 11]]
    - name: "RNA33"
      type: "rnaSequence"
    - name: "DNA25"
      type: "dnaSequence"
    - name: "DNAmod"
      type: "dnaSequence"
      modifications: [["CCD_6OG", 2], ["CCD_6MA", 1]]
    - name: "MG"
      type: "ion"
      count: 1

  - modelSeeds: 1 # 1 model with randomly generated seed
    entities:
    - name: "Dp1"
      type: "proteinChain"
      count: 2
      range: [1021, 1950]
      useStructureTemplate: false

  - job_set_name: "collagen_triple_helix"
    entities:
    - name: "collagenPolypeptide"
      type: "proteinChain"
      count: 3
      maxTemplateDate: "2023-01-01"
      useStructureTemplate: true